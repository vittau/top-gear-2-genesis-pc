# Stock Top Gear 2 (USA), CRC32 BD3074D2. No curated disassembly.
[game]
output_prefix = "tg2"
jump_table_autodiscovery = true
discovery_files = ["irq.discovery.toml", "menu.discovery.toml", "driver.discovery.toml", "road.discovery.toml"]

[ram_layout]
vint_runcount = 0xFF01C6
initial_ssp = 0x00FFFFFE
vbla_stack = 0x00FFFFFE
intr_stack = 0x00FFFFFE

[functions]
# These are per-frame loop tops seeded as entries so a quickstate can resume
# the current screen in place. Each sits inside a larger host routine; the
# recompiler replaces the host's branch to it with a tail transfer, which keeps
# the generated code's behaviour identical while making the loop callable.
# When a resumed loop returns, the engine continues the return addresses on
# the restored guest stack, so each caller continuation is an entry too:
# $001E82 follows `jsr $64C2` (race -> results and next race) and $001E1E
# follows `jsr $1E764` (title/menu -> game setup) in the top-level loop.
# ROM $6538 BNE/$6546 LEA converge at $654C JSR $12E8; $48EA BNE/
# $4904 LEA converge at $490A MOVE.W. No other callable entry uses either
# tail in the discovered stock code; these resume the replaced policy blocks.
extra = [0x000200, 0x0065F2, 0x001E18, 0x001E9D8, 0x001EBF6, 0x001E82, 0x001E1E, 0x00654C, 0x00490A]

# --- Simultaneous music + SFX (game/tg2_audio_both.c) -----------------------
# Audited pre-instruction sites. All are stock instruction boundaries checked
# against the raw ROM; no generated C is edited.
[[widescreen_site]]
addr = 0x01F0D4
kind = "game_hook"

[[widescreen_site]]
addr = 0x0700C8
kind = "game_hook"

# End of the race SFX Z80 image upload routine: the redirect window closes at
# its RTS so later 68K Z80-RAM writes (music mailbox) go back to the music
# driver's core.
[[widescreen_site]]
addr = 0x070188
kind = "game_hook"

# SFX engine command byte: D0 = command, D1/D2/D3 = its parameters. Recorded
# in every mode (env-gated) so BOTH's command stream can be compared with
# SOUND EFFECTS' without depending on where the write is routed.
[[widescreen_site]]
addr = 0x0701DA
kind = "game_hook"

# Native BOTH policies; other sound modes retain the stock routines.
# $206AE is the raw-ROM sprite-row routine (3F00 2F08 D040); the native
# BOTH row uses decoded descriptor geometry and its own glyph allocation.
[[widescreen_site]]
addr = 0x0206AE
kind = "game_hook"
[[widescreen_site]]
addr = 0x006530
kind = "game_hook"
[[widescreen_site]]
addr = 0x0048E2
kind = "game_hook"
[[widescreen_site]]
addr = 0x01ED2C
kind = "game_hook"
[[widescreen_site]]
addr = 0x025032
kind = "game_hook"
[[widescreen_site]]
addr = 0x025078
kind = "game_hook"
[[widescreen_site]]
addr = 0x0250E2
kind = "game_hook"
[[widescreen_site]]
addr = 0x02511C
kind = "game_hook"
[[widescreen_site]]
addr = 0x0251F4
kind = "game_hook"
[[widescreen_site]]
addr = 0x02522E
kind = "game_hook"
[[widescreen_site]]
addr = 0x025298
kind = "game_hook"
[[widescreen_site]]
addr = 0x0252CC
kind = "game_hook"

# Read-only USA presentation captures, audited with tools/disasm_tg2.py.
# Reset scene at the SAT allocator reset; capture mappings before native
# horizontal culling; publish after the native SAT has been linked.
[[widescreen_site]]
addr = 0x0067EE
kind = "game_hook"
[[widescreen_site]]
addr = 0x00B5FA
kind = "game_hook"
# Actor snapshots (game/tg2_actors.c), read-only.
# $B314 (3744 93D4) is the shared projection entry: D0 depth and D2's
# unsigned 16-bit fraction are still intact on BOTH paths (task 39).
[[widescreen_site]]
addr = 0x00B314
kind = "game_hook"
# $B42E/$B4D6 are the instruction after `swap d1` on the interpolated and the
# depth-table path (raw ROM 3C2B 93B4 at both, after 4841): the upper word of
# D1 still holds the discarded X fraction. $B584 (426B A046) is the mapper
# entry with the final model index in D7 and the object record in A1.
[[widescreen_site]]
addr = 0x00B42E
kind = "game_hook"
[[widescreen_site]]
addr = 0x00B4D6
kind = "game_hook"
[[widescreen_site]]
addr = 0x00B584
kind = "game_hook"
[[widescreen_site]]
addr = 0x006982
kind = "game_hook"

# Port-owned controls (game/tg2_controls.c), as native replacements: the
# setup carousel's input handler ($021A62) wraps over four rows, and its
# row/page draw ($021F54) emits only RACE, PLAYER, GEARS and SPEED for the row
# list. Every other state keeps the stock emission.
[[widescreen_site]]
addr = 0x021A62
kind = "game_hook"
[[widescreen_site]]
addr = 0x021F54
kind = "game_hook"

# Host-snapshot frame boundaries: the race picture-ready loop and the
# top-level title/menu loop. The adapter parks a queued quickstate here.
[[widescreen_site]]
addr = 0x0065F2
kind = "game_hook"
[[widescreen_site]]
addr = 0x001E18
kind = "game_hook"
[[widescreen_site]]
addr = 0x001E9D8
kind = "game_hook"
[[widescreen_site]]
addr = 0x001EBF6
kind = "game_hook"

# Password validator returns: raw ROM $0235C0/$0235C4 are both RTS (4E75).
# Read-only capture of D0 and the completed work record, before its caller runs.
[[widescreen_site]]
addr = 0x0235C0
kind = "game_hook"
[[widescreen_site]]
addr = 0x0235C4
kind = "game_hook"
