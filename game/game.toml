# Stock Top Gear 2 (USA), CRC32 BD3074D2. No curated disassembly.
[game]
output_prefix = "tg2"
jump_table_autodiscovery = true
discovery_files = ["irq.discovery.toml", "menu.discovery.toml", "driver.discovery.toml", "road.discovery.toml"]

[ram_layout]
game_mode = 0
vint_runcount = 0xFF01C6
vint_routine = 0
plc_pending = 0
initial_ssp = 0x00FFFFFE
vbla_stack = 0x00FFFFFE
intr_stack = 0x00FFFFFE
player_object = 0
level_modes = []

[functions]
# These are per-frame loop tops seeded as entries so a quickstate can resume
# the current screen in place. Each sits inside a larger host routine; the
# recompiler replaces the host's branch to it with a tail transfer, which keeps
# the generated code's behaviour identical while making the loop callable.
# When a resumed loop returns, the engine continues the return addresses on
# the restored guest stack, so each caller continuation is an entry too:
# $001E82 follows `jsr $64C2` (race -> results and next race) and $001E1E
# follows `jsr $1E764` (title/menu -> game setup) in the top-level loop.
extra = [0x000200, 0x0065F2, 0x001E18, 0x001E9D8, 0x001EBF6, 0x001E82, 0x001E1E]

# --- Simultaneous music + SFX (game/tg2_audio_both.c) -----------------------
# Audited pre-instruction sites. All are stock instruction boundaries checked
# against the raw ROM; no generated C is edited.
[[widescreen_site]]
addr = 0x01F0D4
kind = "game_hook"

[[widescreen_site]]
addr = 0x0700C8
kind = "game_hook"

# End of the race SFX Z80 image upload routine: the redirect window closes at
# its RTS so later 68K Z80-RAM writes (music mailbox) go back to the music
# driver's core.
[[widescreen_site]]
addr = 0x070188
kind = "game_hook"

# SFX engine command byte: D0 = command, D1/D2/D3 = its parameters. Recorded
# in every mode (env-gated) so BOTH's command stream can be compared with
# SOUND EFFECTS' without depending on where the write is routed.
[[widescreen_site]]
addr = 0x0701DA
kind = "game_hook"

# SFX-side policy reads: present 0 while BOTH is selected.
[[widescreen_site]]
addr = 0x006530
kind = "game_hook"
[[widescreen_site]]
addr = 0x0048E2
kind = "game_hook"
# RACE SOUND page entry: the page profile loader copies $FF240E into the page
# value word (A4+$0C). Present MUSIC's 1 while BOTH is selected so the page
# builds its own row and palette from a stock state; restore at the RTS.
[[widescreen_site]]
addr = 0x01ED3A
kind = "game_hook"
[[widescreen_site]]
addr = 0x01ED40
kind = "game_hook"
[[widescreen_site]]
addr = 0x0250E2
kind = "game_hook"
[[widescreen_site]]
addr = 0x02511C
kind = "game_hook"
[[widescreen_site]]
addr = 0x02503A
kind = "game_hook"
[[widescreen_site]]
addr = 0x02504A
kind = "game_hook"
[[widescreen_site]]
addr = 0x02529A
kind = "game_hook"
[[widescreen_site]]
addr = 0x0252CC
kind = "game_hook"

# Restore the stock word before the branch that consumed the read.
[[widescreen_site]]
addr = 0x006538
kind = "game_hook"
[[widescreen_site]]
addr = 0x0048EA
kind = "game_hook"
[[widescreen_site]]
addr = 0x0250E6
kind = "game_hook"
[[widescreen_site]]
addr = 0x025120
kind = "game_hook"
[[widescreen_site]]
addr = 0x02503E
kind = "game_hook"
[[widescreen_site]]
addr = 0x02504E
kind = "game_hook"
[[widescreen_site]]
addr = 0x02529E
kind = "game_hook"
[[widescreen_site]]
addr = 0x0252D0
kind = "game_hook"

# Music-side policy reads: present 1 while BOTH is selected, so music keeps
# running even when the cartridge word is still at its boot value.
[[widescreen_site]]
addr = 0x025088
kind = "game_hook"
[[widescreen_site]]
addr = 0x02508C
kind = "game_hook"
[[widescreen_site]]
addr = 0x025200
kind = "game_hook"
[[widescreen_site]]
addr = 0x025204
kind = "game_hook"
[[widescreen_site]]
addr = 0x02523A
kind = "game_hook"
[[widescreen_site]]
addr = 0x02523E
kind = "game_hook"

# Read-only USA presentation captures, audited with tools/disasm_tg2.py.
# Reset scene at the SAT allocator reset; capture mappings before native
# horizontal culling; publish after the native SAT has been linked.
[[widescreen_site]]
addr = 0x0067EE
kind = "game_hook"
[[widescreen_site]]
addr = 0x00B5FA
kind = "game_hook"
[[widescreen_site]]
addr = 0x006982
kind = "game_hook"
# SPIKE (task 29): LOD model index at mapper entry and the resolved piece list.
[[widescreen_site]]
addr = 0x00B584
kind = "game_hook"
[[widescreen_site]]
addr = 0x00B5F0
kind = "game_hook"

# Host-snapshot frame boundaries: the race picture-ready loop and the
# top-level title/menu loop. The adapter parks a queued quickstate here.
[[widescreen_site]]
addr = 0x0065F2
kind = "game_hook"
[[widescreen_site]]
addr = 0x001E18
kind = "game_hook"
[[widescreen_site]]
addr = 0x001E9D8
kind = "game_hook"
[[widescreen_site]]
addr = 0x001EBF6
kind = "game_hook"

# Password validator returns: raw ROM $0235C0/$0235C4 are both RTS (4E75).
# Read-only capture of D0 and the completed work record, before its caller runs.
[[widescreen_site]]
addr = 0x0235C0
kind = "game_hook"
[[widescreen_site]]
addr = 0x0235C4
kind = "game_hook"
