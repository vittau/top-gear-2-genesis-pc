# segagenesisrecomp launcher settings. Edited by the launcher;
# hand-editable. SDL scancodes are numeric (see SDL_scancode.h).

[video]
window_scale = 2
fullscreen = 0
linear_filter = 0
internal_scale = 1
widescreen = 0
widescreen_cells = 8
presentation_rate = 0

[audio]
volume = 100
frequency = 48000
bypass_filter = 0

[launcher]
skip_launcher = 1

[input.p1]
device = 2        ; 0 none, 1 keyboard, 2 gamepad, 3 both
pad_type = 0      ; 0 = 3-button, 1 = 6-button
deadzone = 25
key.Up = 82
key.Down = 81
key.Left = 80
key.Right = 79
key.A = 29
key.B = 27
key.C = 6
key.Start = 40
key.X = 4
key.Y = 22
key.Z = 7
key.Mode = 42
pad.Up = button:11
pad.Down = button:12
pad.Left = button:13
pad.Right = button:14
pad.A = button:2
pad.B = button:3   ; user override: Genesis B on the face-top button
pad.C = button:2
pad.Start = button:6
pad.X = button:3
pad.Y = button:9
pad.Z = button:10
pad.Mode = button:4

[input.p2]
device = 2        ; second gamepad, as the owner enabled it on the Deck
pad_type = 0
deadzone = 25

[mods.widescreen]
enabled = 0
aspect = 16:9

[mods.race60]
enabled = 1

[mods.hud]
placement = centered

[mods.overscan]
hidden = 1

[mods.racesound]
mode = 0

[mods.musicvol]
percent = 100

[mods.sfxvol]
percent = 100

[mods.diagnostics]
enabled = 0
